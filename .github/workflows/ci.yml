name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check_changes:
    runs-on: ubuntu-latest
    outputs:
      norn_m_changed: ${{ steps.filter.outputs.norn_m }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v2
      id: filter
      with:
        filters: |
          norn_m:
            - 'norn_m/**'
            - 'tests/**'
            - '.github/workflows/ci.yml'
            - 'pyproject.toml'

  build_norn_m:
    needs: check_changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Skip — no relevant changes
        if: needs.check_changes.outputs.norn_m_changed != 'true'
        run: echo "No changes in norn_m/, tests/, pyproject.toml, or ci.yml — skipping"
      - uses: actions/checkout@v4
        if: needs.check_changes.outputs.norn_m_changed == 'true'
      - name: Set up Python ${{ matrix.python-version }}
        if: needs.check_changes.outputs.norn_m_changed == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Clean up disk space
        if: needs.check_changes.outputs.norn_m_changed == 'true'
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a
          df -h
      - name: Install Hatch
        if: needs.check_changes.outputs.norn_m_changed == 'true'
        run: pip install hatch
      - name: Load cached venv
        if: needs.check_changes.outputs.norn_m_changed == 'true'
        id: cached-hatch-dependencies
        uses: actions/cache@v3
        with:
          path: .venv
          key: venv-norn-m-${{ runner.os }}-${{ hashFiles('**/pyproject.toml') }}
      - name: Install GEOS Libraries
        if: needs.check_changes.outputs.norn_m_changed == 'true'
        run: sudo apt-get update && sudo apt-get install -y libgeos-dev
      - name: Install dependencies
        if: needs.check_changes.outputs.norn_m_changed == 'true' && steps.cached-hatch-dependencies.outputs.cache-hit != 'true'
        run: |
          pip install --upgrade pip
          pip install -e ".[test,graph,vector_stores,llms,extras]"
          pip install ruff==0.16.0
      - name: Run Linting
        if: needs.check_changes.outputs.norn_m_changed == 'true'
        run: make lint
      - name: Run tests and generate coverage report
        if: needs.check_changes.outputs.norn_m_changed == 'true'
        run: make test
