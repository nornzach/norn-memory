version: '3.8'

services:
  # Norn-M API服务
  norn-m-api:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: norn-m-api
    ports:
      - "8000:8000"
    environment:
      - NORN_M_DATABASE_URL=${NORN_M_DATABASE_URL:-postgresql://norn:norn@db:5432/norn_m}
      - NORN_M_SECRET_KEY=${NORN_M_SECRET_KEY}
      - NORN_M_LLM_PROVIDER=${NORN_M_LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NORN_M_VECTOR_STORE=pgvector
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./server/logs:/app/logs
    networks:
      - norn-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL + pgvector
  db:
    image: ankane/pgvector:latest
    container_name: norn-m-db
    environment:
      - POSTGRES_USER=norn
      - POSTGRES_PASSWORD=norn
      - POSTGRES_DB=norn_m
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - norn-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U norn"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Dashboard前端（可选）
  dashboard:
    build:
      context: ./server/dashboard
      dockerfile: Dockerfile
    container_name: norn-m-dashboard
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - norn-m-api
    restart: unless-stopped
    networks:
      - norn-network

volumes:
  postgres-data:
    driver: local

networks:
  norn-network:
    driver: bridge
